name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint --if-present
      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Lint backend
        run: |
          cd backend
          npm run lint --if-present
      - name: Build backend
        run: |
          cd backend
          npm run build --if-present
